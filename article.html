<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Article | RHODVICK TECH</title>
  <meta name="description" content="Read the latest technology news on RHODVICK TECH.">

  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --red: #ff303b;
      --blue: #168bff;
      --dark: #080b12;
      --panel: #111724;
      --text: #f4f7ff;
      --muted: #a5afc2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--dark);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.75;
    }

    .article-wrap {
      width: min(900px, 92%);
      margin: 35px auto 70px;
    }

    .back-link {
      display: inline-block;
      color: var(--blue);
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .article-label {
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #article-title {
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.2;
      margin: 14px 0;
      overflow-wrap: anywhere;
    }

    .article-meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    #article-image {
      display: none;
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      border-radius: 14px;
      margin: 20px 0 30px;
    }

    .article-panel {
      background: var(--panel);
      border: 1px solid #263246;
      border-radius: 14px;
      padding: clamp(20px, 5vw, 38px);
    }

    .article-panel h2 {
      font-size: 23px;
      margin-top: 0;
    }

    #article-summary {
      white-space: pre-line;
      color: #dce4f2;
      font-size: 17px;
    }

    .status-note {
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      margin: 14px 0 0;
      animation: statusPulse 1.6s ease-in-out infinite;
    }

    .status-note.done { animation: none; }

    @keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

    /* NEW: full article body */
    #article-body { color: #dce4f2; font-size: 17px; }
    #article-body p { margin: 0 0 1.2em; }
    #article-body img { max-width: 100%; height: auto; border-radius: 10px; margin: 16px 0; }
    #article-body a { color: var(--blue); overflow-wrap: anywhere; }
    #article-body h2, #article-body h3 { margin: 1.4em 0 .6em; }
    #article-body blockquote {
      border-left: 4px solid var(--blue);
      margin: 1em 0;
      padding-left: 16px;
      color: var(--muted);
    }

    .source-box {
      margin-top: 28px;
      padding: 20px;
      border-left: 4px solid var(--red);
      background: #0b111d;
      border-radius: 6px;
    }

    .source-box a {
      color: var(--blue);
      overflow-wrap: anywhere;
    }

    .brand-note {
      margin-top: 35px;
      text-align: center;
      color: var(--muted);
    }

    .brand-note strong {
      color: var(--text);
      letter-spacing: 2px;
    }

    .brand-note span { color: var(--red); }

    .error-message {
      padding: 24px;
      border: 1px solid #263246;
      border-radius: 12px;
      background: var(--panel);
    }

    .error-message a { color: var(--blue); }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 25px 15px;
      border-top: 1px solid #263246;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <rhodvick-nav></rhodvick-nav>

  <main class="article-wrap">
    <a class="back-link" href="index.html#news">← Back to Latest News</a>

    <div id="article-content">
      <p>Loading article...</p>
    </div>

    <div class="brand-note">
      <strong>RHODVICK <span>TECH</span></strong>
      <p>Technology moves fast. Stay informed. Stay connected.</p>
    </div>
  </main>

  <footer>
    © <span id="year"></span> RHODVICK TECH. All rights reserved.
  </footer>

  <rhodvick-footer></rhodvick-footer>

  <script src="components/rhodvick-nav.js"></script>
  <script src="components/rhodvick-footer.js"></script>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    const container = document.getElementById("article-content");
    let article = null;

    try {
      article = JSON.parse(
        sessionStorage.getItem("rhodvickCurrentArticle") || "null"
      );
    } catch (error) {
      article = null;
    }

    function addTextElement(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text || "";
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    /* NEW: strips dangerous tags/attributes from feed HTML */
    function buildSafeContent(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");

      doc.querySelectorAll(
        "script,style,iframe,object,embed,form,input,button,noscript,svg,link,meta"
      ).forEach(el => el.remove());

      const allowed = { A: ["href"], IMG: ["src", "alt"] };

      doc.body.querySelectorAll("*").forEach(el => {
        const keep = allowed[el.tagName] || [];
        [...el.attributes].forEach(attr => {
          if (!keep.includes(attr.name)) el.removeAttribute(attr.name);
        });

        if (el.tagName === "A") {
          const href = el.getAttribute("href") || "";
          if (/^https?:\/\//i.test(href)) {
            el.target = "_blank";
            el.rel = "noopener noreferrer";
          } else {
            el.removeAttribute("href");
          }
        }

        if (el.tagName === "IMG") {
          const src = el.getAttribute("src") || "";
          if (/^https?:\/\//i.test(src)) el.loading = "lazy";
          else el.remove();
        }
      });

      return doc.body;
    }

    /* NEW: asks /api/article for the publisher's full story */
    async function loadFullArticle(body, statusEl) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);

        const response = await fetch(
          "/api/article?url=" + encodeURIComponent(article.url),
          { signal: controller.signal }
        );

        clearTimeout(timer);

        if (!response.ok) throw new Error("Bad response");

        const data = await response.json();
        if (!data.content) throw new Error("No content");

        const safe = buildSafeContent(data.content);
        const text = (safe.textContent || "").trim();

        // Only replace the summary if we really got more than it
        if (text.length < (article.description || "").length + 50) {
          throw new Error("Not longer than the summary");
        }

        body.replaceChildren(...safe.childNodes);
        statusEl.remove();
      } catch (error) {
        statusEl.classList.add("done");
        statusEl.textContent =
          "The full story couldn't be loaded here. Use the link below to read it at the source.";
      }
    }

    if (!article || !article.title) {
      container.replaceChildren();

      const message = document.createElement("div");
      message.className = "error-message";

      addTextElement(message, "h2", "No article selected");
      addTextElement(
        message,
        "p",
        "Please return to the news homepage and choose an article to read."
      );

      const link = document.createElement("a");
      link.href = "index.html#news";
      link.textContent = "Browse the latest news →";
      message.appendChild(link);

      container.appendChild(message);
    } else {
      container.replaceChildren();

      addTextElement(
        container, "div", "Technology News", "article-label"
      );

      addTextElement(container, "h1", article.title).id = "article-title";

      const metaParts = [];
      if (article.source) metaParts.push(article.source);
      if (article.date) metaParts.push(article.date);

      addTextElement(
        container,
        "div",
        metaParts.join(" • "),
        "article-meta"
      );

      if (article.image) {
        try {
          const imageUrl = new URL(article.image);
          if (imageUrl.protocol === "https:" ||
              imageUrl.protocol === "http:") {
            const img = document.createElement("img");
            img.id = "article-image";
            img.src = imageUrl.href;
            img.alt = article.title;
            img.style.display = "block";
            img.addEventListener("error", () => img.remove());
            container.appendChild(img);
          }
        } catch (error) {}
      }

      const panel = document.createElement("section");
      panel.className = "article-panel";

      addTextElement(panel, "h2", "The Story");

      /* NEW: show full content when the feed provides it */
      const body = document.createElement("div");
      body.id = "article-body";

      const descLength = (article.description || "").length;
      const contentText = article.content
        ? new DOMParser().parseFromString(article.content, "text/html").body.textContent
        : "";

      let needsFullStory = false;

      if (contentText.trim().length > descLength + 50) {
        // Full story available from the feed
        body.append(...buildSafeContent(article.content).childNodes);
      } else {
        // Feed only provides a summary: show it now, fetch the rest
        body.textContent =
          article.description || "A short summary is not available for this story.";
        needsFullStory = true;
      }

      panel.appendChild(body);

      if (needsFullStory && article.url) {
        const status = document.createElement("p");
        status.className = "status-note";
        status.textContent = "Loading the full story…";
        panel.appendChild(status);
        loadFullArticle(body, status);
      }

      const sourceBox = document.createElement("div");
      sourceBox.className = "source-box";

      addTextElement(sourceBox, "h3", "Read the original report");
      addTextElement(
        sourceBox,
        "p",
        "Originally published by " + (article.source || "the publisher") +
        ". Visit their website for the original report, related coverage and any updates."
      );

      try {
        const sourceUrl = new URL(article.url);
        if (sourceUrl.protocol === "https:" ||
            sourceUrl.protocol === "http:") {
          const sourceLink = document.createElement("a");
          sourceLink.href = sourceUrl.href;
          sourceLink.target = "_blank";
          sourceLink.rel = "noopener noreferrer";
          sourceLink.textContent = "Continue to the original source →";
          sourceBox.appendChild(sourceLink);
        }
      } catch (error) {
        addTextElement(sourceBox, "p", "The original link is unavailable.");
      }

      panel.appendChild(sourceBox);
      container.appendChild(panel);
    }

    if (window.feather) {
      window.feather.replace();
    }
  </script>
</body>
</html>
